[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casr"
version = "0.1.0"
description = "Correction-Aware Selective Repair research harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "GitPython>=3.1.43,<4",
  "networkx>=3.4,<4",
  "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
